<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplos de Formulario</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="iano">Em que ano voce nasceu</label>
            <input type="number" name="ano" id="iano" oninput= "calcu()" >
        </p>
        <p>
            <label for="idade">Sua idade é : </label>
            <output id="idade">0</output>
            
        </p>
        <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
        </p>
        
        <script>
            function calcu() {
                var atual = new Date().getFullYear() 
                idade.innerHTML = Number(atual) - Number(iano.value)
            }
        </script>
</body>
</html>
